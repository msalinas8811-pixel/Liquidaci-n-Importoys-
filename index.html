<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ventas y Liquidación</title>
<meta name="theme-color" content="#1F4FB8">
<meta name="description" content="Control de ventas, inventario, gastos y liquidación de Importoys e Importshop.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Importoys">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
html,body{height:auto}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: una columna centrada (máx. 760px), barra de pestañas fija arriba; listas como filas dentro de un grupo por mes, resúmenes como tarjetas por mes. */
:root{
  --bg:#F3F6FC; --surface:#FFFFFF; --surface2:#E7EDF8; --ink:#12234A; --muted:#5A6788; --line:#D5DDEE;
  --brand:#1F4FB8; --brand-ink:#FFFFFF; --toys:#1F4FB8; --shop:#C45A08; --bodega:#A82C86;
  --good:#13794A; --bad:#C8202A; --focus:#1F4FB8;
  --logo-blue:#1F4FB8; --logo-red:#E3242B; --logo-yellow:#FFC61A;
  --f-display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-num:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1328; --surface:#141D38; --surface2:#1E2A4D; --ink:#EAF0FF; --muted:#9FAECF; --line:#273459;
  --brand:#7FA3FF; --brand-ink:#0C1328; --toys:#7FA3FF; --shop:#FFA24D; --bodega:#F07BC8;
  --good:#5ED093; --bad:#FF7F86; --focus:#7FA3FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1328; --surface:#141D38; --surface2:#1E2A4D; --ink:#EAF0FF; --muted:#9FAECF; --line:#273459;
  --brand:#7FA3FF; --brand-ink:#0C1328; --toys:#7FA3FF; --shop:#FFA24D; --bodega:#F07BC8;
  --good:#5ED093; --bad:#FF7F86; --focus:#7FA3FF; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);min-height:100%;
  padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:760px;margin:0 auto}
h1,h2,h3,p{margin:0}
h1,h2,h3,.big{font-family:var(--f-display)}
h1{font-size:27px;line-height:1.1;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:21px;font-weight:700;letter-spacing:-.005em}
h3{font-size:15.5px;font-weight:600}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 16px;align-items:center;padding-bottom:12px}
.brand{background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px 10px;display:flex}
.logo{display:block;width:auto;height:auto;max-height:118px;max-width:100%}
.top h1{align-self:center}
.top .legend{grid-column:1/-1}
.stripe{height:4px;border-radius:2px;margin-bottom:12px;background:linear-gradient(90deg,var(--logo-blue) 0 34%,var(--logo-red) 34% 67%,var(--logo-yellow) 67% 100%)}
@media (min-width:640px){.logo{max-height:150px}.top h1{font-size:32px}}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:500}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--c,var(--muted));vertical-align:baseline}
.h-Importoys{--c:var(--toys)} .h-Importshop{--c:var(--shop)} .h-Bodega{--c:var(--bodega)} .h-doc{--c:var(--brand)}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;background:var(--bg);border-bottom:1px solid var(--line);overflow-x:auto;margin-bottom:18px}
.tabs button{flex:1 1 auto;min-width:0;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:12px 6px;font-size:12.5px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--brand);border-bottom-color:var(--logo-yellow);border-bottom-width:3px;font-weight:600}

.sec-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sec-head .sub{color:var(--muted);font-size:13px;margin-top:2px}
.btn{background:var(--brand);color:var(--brand-ink);border:1px solid var(--brand);border-radius:8px;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer;min-height:40px}
.btn.ghost{background:transparent;color:var(--brand);border-color:var(--line)}
.btn.bad{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn:disabled{opacity:.55;cursor:default}
.lk{background:none;border:0;padding:8px 8px;min-height:36px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border-radius:6px}
.lk:hover{color:var(--ink);background:var(--surface2)}
.lk.bad{color:var(--bad)}

.tools{display:grid;gap:10px;margin-bottom:16px}
.tools input[type=search]{width:100%}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;cursor:pointer;display:flex;gap:6px;align-items:baseline}
.chip .num{font-size:12px;color:var(--muted)}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.chip.on .num{color:var(--brand-ink);opacity:.85}

input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:16px;min-height:44px}
input[type=radio]{width:auto;min-height:0}
textarea{font-family:var(--f-num);font-size:13px;min-height:0}

.month-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:22px 0 8px}
.month-head:first-of-type{margin-top:0}
.month-head .num{font-size:12.5px;color:var(--muted);text-align:right}
.group{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 14px}
.row+.row{border-top:1px solid var(--line)}
.row h3{overflow-wrap:anywhere}
.r-main p{color:var(--muted);font-size:13.5px;overflow-wrap:anywhere}
.r-amt{text-align:right;font-size:16px;font-weight:500}
.r-amt small{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
.r-meta{grid-column:1/-1;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.guide{font-family:var(--f-num);margin-left:6px}
.r-foot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px}
.acts{display:flex;gap:2px;align-items:center;flex-wrap:wrap}
.holder{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.holder select{width:auto;min-height:36px;padding:5px 8px;font-weight:600;color:var(--c);border-color:color-mix(in srgb,var(--c) 45%,var(--line));background:color-mix(in srgb,var(--c) 9%,var(--surface))}
.tag{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:2px 6px;border-radius:4px;background:var(--surface2);color:var(--muted);vertical-align:middle;margin-left:4px}
.who{display:inline-flex;align-items:center;font-size:12.5px;font-weight:600;color:var(--c)}
.stat{font-size:12.5px;color:var(--muted)}
.stat b{color:var(--ink);font-weight:600}
.pill-bad{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--bad);margin-left:6px}

.empty{border:1px dashed var(--line);border-radius:12px;padding:22px 18px;color:var(--muted);display:grid;gap:10px;justify-items:start}
.empty strong{color:var(--ink);font-family:var(--f-display);font-size:17px}
.banner{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;margin-bottom:16px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:13.5px}
.banner.warn{border-color:var(--bad);color:var(--bad)}

.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.trio>div{background:var(--surface);padding:12px 12px;min-width:0}
.trio .lab{font-size:12px;font-weight:600;color:var(--c);display:flex;align-items:center}
.trio .val{font-size:clamp(13px,3.9vw,17px);font-weight:500;margin-top:4px;overflow-wrap:anywhere}
.trio .cnt{font-size:11.5px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.card-pad{padding:14px}
.mcard-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:14px 14px 12px}
.mcard-head .num{font-size:20px;font-weight:500}
.mcard-head small{display:block;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;text-align:right;font-family:var(--f-body);font-weight:500}
.kv{display:grid;gap:0;margin:0}
.kv>div{display:flex;justify-content:space-between;gap:12px;padding:8px 14px;font-size:14px}
.kv>div+div{border-top:1px solid var(--line)}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right}
.kv .strong dt,.kv .strong dd{color:var(--ink);font-weight:600}
details{border-top:1px solid var(--line)}
summary{cursor:pointer;padding:11px 14px;font-size:13.5px;font-weight:500;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--muted);font-family:var(--f-num)}
details[open]>summary::after{content:"–"}
.mini{display:flex;justify-content:space-between;gap:12px;padding:7px 14px;font-size:13px;border-top:1px dashed var(--line)}
.mini span:first-child{min-width:0;overflow-wrap:anywhere}
.mini small{display:block;color:var(--muted);font-size:11.5px}
.subhead{padding:12px 14px 4px;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;border-top:1px solid var(--line)}

.hero{padding:18px 16px;display:grid;gap:4px}
.hero .lab{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.hero .big{font-size:38px;line-height:1.05;font-weight:700;letter-spacing:-.01em}
.hero .sub{color:var(--muted);font-size:13.5px}
.pays{display:grid;gap:0}
.pay{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;padding:14px;font-size:16px}
.pay+.pay{border-top:1px solid var(--line)}
.pay .num{font-size:20px;font-weight:500}
.pay .arrow{color:var(--muted)}
.ok{padding:14px;color:var(--good);font-weight:600}
.party{margin-top:12px}
.party-head{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.party-head h3{display:flex;align-items:center}
.res{padding:10px 14px 12px;border-top:1px solid var(--line);font-size:13.5px;font-weight:600}
.res.up{color:var(--bad)} .res.down{color:var(--good)} .res.zero{color:var(--muted)}
.sec-title{margin:22px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.check{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;font-size:13.5px}
.check input{width:20px;min-height:0;margin-top:1px;flex:0 0 auto}
.check small{display:block;color:var(--muted);font-size:12.5px}
.iva-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 14px;padding:12px 14px;align-items:end}
.iva-row+.iva-row{border-top:1px solid var(--line)}
.iva-m,.iva-pay{display:grid;gap:2px;min-width:0}
.iva-pay b{font-size:19px;font-weight:500}
.iva-pay small{color:var(--muted);font-size:12px}
.iva-hint{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.row-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

.sheet{position:fixed;inset:0;z-index:50;display:grid;align-items:end;justify-items:center;background:rgba(10,14,22,.5);padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
.panel{width:100%;max-width:560px;max-height:94%;overflow:auto;background:var(--surface);border-radius:16px 16px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
@media (min-width:640px){.sheet{align-items:center}.panel{border-radius:16px;max-height:90%;padding-bottom:20px}}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fld{display:grid;gap:5px;margin-bottom:12px;min-width:0}
.grid2 .fld{margin-bottom:0}
.grid2{margin-bottom:12px}
.fld label,.fld .lbl{font-size:12.5px;font-weight:600;color:var(--muted)}
.segs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg{position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:11px 6px;border:1px solid var(--line);border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;background:var(--bg)}
.seg input:checked+span{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.seg input:focus-visible+span{outline:2px solid var(--focus);outline-offset:2px}
.readout{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;background:var(--surface2);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.readout b{font-size:20px;font-weight:500}
.readout small{color:var(--muted);font-size:12.5px}
.err{color:var(--bad);font-size:13.5px;min-height:1.2em;margin-bottom:8px}
.form-foot{display:flex;gap:8px;justify-content:flex-end}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--brand);color:var(--brand-ink);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:500;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.toast.bad{background:var(--bad);color:var(--surface)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.foot{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);display:grid;gap:10px;font-size:12.5px;color:var(--muted)}
.foot .btns{display:flex;gap:8px;flex-wrap:wrap}
.foot .btn{font-size:13px;min-height:38px;padding:7px 12px}
</style>
</head>

var esc=function(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var cents=function(v){return Math.round((Number(v)||0)*100)};
var num=function(v){var n=parseFloat(String(v==null?'':v).replace(',','.'));return isNaN(n)?0:n};
var USD=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'});
var money=function(c){return USD.format(c/100)};
var pad=function(n){return String(n).padStart(2,'0')};
var today=function(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var mkey=function(d){return String(d||'').slice(0,7)};
var mlabel=function(k){var p=String(k).split('-');return (MONTHS[+p[1]-1]||k)+' '+p[0]};
var fdate=function(d){var p=String(d||'').split('-');return (p.length===3&&MONTHS[+p[1]-1])?(+p[2])+' '+MONTHS[+p[1]-1].slice(0,3).toLowerCase()+' '+p[0]:String(d||'')};
var gross=function(s){return cents(s.unitPrice)*(parseInt(s.qty,10)||0)};
var net=function(s){return gross(s)-cents(s.discount)};
var plural=function(n,a,b){return n+' '+(n===1?a:b)};

var S={db:null,err:null,inv:[],sales:[],exp:[],cfg:{deduct:true},loaded:{inv:false,sales:false,exp:false,cred:false},credit:{},creditDocs:[],restore:null,
  tab:'ventas',hf:'all',q:'',liq:null,open:new Set(),del:null,copy:null};

/* ---------- datos ---------- */
function retry(fn){return fn().catch(function(e){
  if(e&&e.code==='unavailable'){return new Promise(function(r){setTimeout(r,600+Math.random()*600)}).then(fn)}
  throw e})}
function errMsg(e){
  var c=e&&e.code;
  if(c==='invalid_argument')return 'No tienes permiso para guardar cambios en esta página.';
  if(c==='quota_exceeded')return 'Se llenó el espacio de almacenamiento del dispositivo.';
  return 'No se pudo guardar. Intenta de nuevo.';
}
function run(fn,ok){return retry(fn).then(function(){if(ok)toast(ok);return true}).catch(function(e){toast(errMsg(e),true);return false})}
function mapDocs(snap){return snap.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o})}
async function init(){
  buildTabs();render();
  try{S.db=makeLocalDb()}catch(e){S.db=null}
  if(!S.db){S.err='nodb';render();return}
  var bad=function(){S.err='dberr';sched()};
  S.db.collection('inventory').onSnapshot(function(s){S.inv=mapDocs(s);S.loaded.inv=true;sched()},bad);
  S.db.collection('sales').onSnapshot(function(s){S.sales=mapDocs(s);S.loaded.sales=true;sched()},bad);
  S.db.collection('expenses').onSnapshot(function(s){S.exp=mapDocs(s);S.loaded.exp=true;sched()},bad);
  S.db.collection('ivaCredit').onSnapshot(function(s){S.creditDocs=mapDocs(s);S.credit={};S.creditDocs.forEach(function(d){S.credit[d.id]=Number(d.amount)||0});S.loaded.cred=true;sched()},bad);
  S.db.doc('config/main').onSnapshot(function(s){var d=s.exists?s.data():{};S.cfg={deduct:d.deduct!==false};sched()},bad);
}

/* ---------- cálculos ---------- */
function sold(pid,exceptId){var t=0;S.sales.forEach(function(s){if(s.productId===pid&&s.id!==exceptId)t+=parseInt(s.qty,10)||0});return t}
function avail(p,exceptId){return (parseInt(p.qty,10)||0)-sold(p.id,exceptId)}
function allMonths(){var m={};S.sales.forEach(function(s){if(s.date)m[mkey(s.date)]=1});allExp().forEach(function(e){if(e.date)m[mkey(e.date)]=1});return Object.keys(m).sort().reverse()}
function cmpSale(a,b){return String(b.date).localeCompare(String(a.date))||(b.createdAt||0)-(a.createdAt||0)}

function calc(key){
  var inM=function(d){return key==='all'||mkey(d)===key};
  var P={};HOLDERS.forEach(function(h){P[h]={name:h,inc:0,comm:0,exp:0,n:0,list:[]}});
  var sellers={};
  S.sales.filter(function(s){return inM(s.date)}).forEach(function(s){
    var h=P[s.holder]||P.Bodega,v=net(s),c=cents(s.commission);
    h.inc+=v;h.comm+=c;h.n++;h.list.push(s);
    var k=String(s.seller||'').trim()||'Sin vendedor';
    var o=sellers[k]||(sellers[k]={n:0,sales:0,comm:0});o.n++;o.sales+=v;o.comm+=c;
  });
  var tax=0;
  allExp().filter(function(e){return inM(e.date)}).forEach(function(e){var c=cents(e.amount);(P[e.who]||P.Importoys).exp+=c;if(e.auto)tax+=c});
  var ded=S.cfg.deduct!==false,T={inc:0,comm:0,exp:0,n:0};
  HOLDERS.forEach(function(h){T.inc+=P[h].inc;T.comm+=P[h].comm;T.exp+=P[h].exp;T.n+=P[h].n});
  var profit=T.inc-(ded?T.comm:0)-T.exp;
  HOLDERS.forEach(function(h){P[h].bal=P[h].inc-(ded?P[h].comm:0)-P[h].exp});
  var half=Math.floor(profit/2);
  P.Importoys.target=half;P.Importshop.target=profit-half;P.Bodega.target=0;
  HOLDERS.forEach(function(h){P[h].diff=P[h].bal-P[h].target});
  var give=HOLDERS.filter(function(h){return P[h].diff>0}).map(function(h){return {h:h,r:P[h].diff}})
    .sort(function(a,b){return a.h==='Bodega'?-1:b.h==='Bodega'?1:b.r-a.r});
  var take=HOLDERS.filter(function(h){return P[h].diff<0}).map(function(h){return {h:h,r:-P[h].diff}}).sort(function(a,b){return b.r-a.r});
  var pays=[],i=0,j=0;
  while(i<give.length&&j<take.length){
    var a=Math.min(give[i].r,take[j].r);
    if(a>0)pays.push({from:give[i].h,to:take[j].h,amt:a});
    give[i].r-=a;take[j].r-=a;
    if(give[i].r===0)i++;if(take[j].r===0)j++;
  }
  return {P:P,sellers:sellers,T:T,profit:profit,ded:ded,pays:pays,half:half,tax:tax};
}

/* ---------- interfaz base ---------- */
var pending=false;
function sched(){if(pending)return;pending=true;requestAnimationFrame(render)}
function buildTabs(){
  $('#tabs').innerHTML=TABS.map(function(t){return '<button type="button" data-a="tab" data-v="'+t[0]+'">'+t[1]+'</button>'}).join('');
}
function ready(){return S.err==='nodb'||(S.loaded.inv&&S.loaded.sales&&S.loaded.exp&&S.loaded.cred)}
var toastT;
function toast(msg,bad){var t=$('#toast');t.textContent=msg;t.className='toast show'+(bad?' bad':'');clearTimeout(toastT);toastT=setTimeout(function(){t.className='toast'},2800)}

function hasExamples(){return S.inv.concat(S.sales,S.exp,S.creditDocs).some(function(x){return x.example})}
function bannerHTML(){
  var h='';
  if(S.err==='nodb')h+='<div class="banner warn">Esta vista no puede guardar datos. Abre la página con tu cuenta de Claude para registrar ventas.</div>';
  if(S.err==='dberr')h+='<div class="banner warn">Se perdió la conexión con los datos. Recarga la página.</div>';
  if(S.restore){
    var n=0;['inventory','sales','expenses','ivaCredit'].forEach(function(c){n+=Object.keys(S.restore[c]||{}).length});
    h+='<div class="banner"><span><b>¿Restaurar copia?</b> Tiene '+plural(n,'registro','registros')+' y reemplaza los datos actuales.</span><span><button class="btn bad" data-a="restore-yes">Sí, restaurar</button> <button class="lk" data-a="restore-no">Cancelar</button></span></div>';
  }
  if(ready()&&hasExamples()){
    h+='<div class="banner"><span><b>Datos de ejemplo.</b> Bórralos cuando empieces con tus ventas reales.</span>'+
      (S.del==='ex'?'<span><button class="btn bad" data-a="clear-ex">Sí, borrar ejemplos</button> <button class="lk" data-a="del-no">Cancelar</button></span>'
        :'<button class="btn ghost" data-a="ask-clear-ex">Borrar ejemplos</button>')+'</div>';
  }
  return h;
}

function render(){
  pending=false;
  var view=$('#view'),ae=document.activeElement;
  var keep=ae&&ae.id&&view.contains(ae)?{id:ae.id,s:ae.selectionStart,e:ae.selectionEnd}:null;
  document.querySelectorAll('#tabs button').forEach(function(b){var on=b.dataset.v===S.tab;b.classList.toggle('on',on);b.setAttribute('aria-selected',on)});
  $('#banner').innerHTML=bannerHTML();
  var h;
  if(!ready())h='<div class="empty"><strong>Cargando datos…</strong><span>Esto tarda unos segundos.</span></div>';
  else h=S.tab==='ventas'?viewSales():S.tab==='inventario'?viewInv():S.tab==='gastos'?viewExp():S.tab==='resumen'?viewSummary():viewLiq();
  view.innerHTML=h;
  if(keep){var el=document.getElementById(keep.id);if(el){el.focus();try{el.setSelectionRange(keep.s,keep.e)}catch(_){}}}
}

/* ---------- ventas ---------- */
function holderOptions(cur){return HOLDERS.map(function(h){return '<option value="'+h+'"'+(h===cur?' selected':'')+'>'+h+'</option>'}).join('')}
function actsHTML(kind,id){
  var key=kind+':'+id;
  if(S.del===key)return '<span class="acts"><button class="btn bad" data-a="del-yes" data-k="'+kind+'" data-id="'+id+'">Sí, eliminar</button><button class="lk" data-a="del-no">Cancelar</button></span>';
  return '<span class="acts"><button class="lk" data-a="edit-'+kind+'" data-id="'+id+'">Editar</button><button class="lk bad" data-a="ask-del" data-k="'+kind+'" data-id="'+id+'">Eliminar</button></span>';
}
function saleRow(s){
  var d=cents(s.discount),c=cents(s.commission);
  var sub=[];if(d)sub.push('Desc. −'+money(d));if(c)sub.push('Com. '+money(c));
  var meta=[fdate(s.date),String(s.seller||'').trim()||'Sin vendedor',s.payment,s.channel].filter(Boolean).map(esc).join(' · ');
  return '<article class="row">'+
    '<div class="r-main"><h3>'+esc(s.customer)+(s.doc==='CF'||s.doc==='CCF'?'<span class="tag">'+s.doc+'</span>':'')+(s.example?'<span class="tag">Ejemplo</span>':'')+'</h3><p>'+esc(s.productName)+(s.productModel?' · '+esc(s.productModel):'')+' × '+(parseInt(s.qty,10)||0)+'</p></div>'+
    '<div class="r-amt num">'+money(net(s))+(sub.length?'<small>'+sub.join(' · ')+'</small>':'')+'</div>'+
    '<p class="r-meta">'+meta+(s.guide?'<span class="guide">Guía '+esc(s.guide)+'</span>':'')+'</p>'+
    '<div class="r-foot"><label class="holder h-'+esc(s.holder)+'"><span>Dinero en</span><select data-a="holder" data-id="'+s.id+'" aria-label="Quién tiene el dinero de la venta de '+esc(s.customer)+'">'+holderOptions(s.holder)+'</select></label>'+actsHTML('sale',s.id)+'</div>'+
  '</article>';
}
function viewSales(){
  var q=S.q.trim().toLowerCase();
  var list=S.sales.filter(function(s){
    if(S.hf!=='all'&&s.holder!==S.hf)return false;
    return !q||[s.customer,s.guide,s.seller,s.productName,s.productModel].join(' ').toLowerCase().indexOf(q)>=0;
  }).sort(cmpSale);
  var totals={all:0};HOLDERS.forEach(function(h){totals[h]=0});
  S.sales.forEach(function(s){var v=net(s);totals.all+=v;totals[HOLDERS.indexOf(s.holder)>=0?s.holder:'Bodega']+=v});
  var h='<div class="sec-head"><div><h2>Ventas</h2><p class="sub">'+plural(S.sales.length,'venta registrada','ventas registradas')+' · '+money(totals.all)+'</p></div><button class="btn" data-a="new-sale">+ Nueva venta</button></div>';
  if(!S.sales.length){
    return h+'<div class="empty"><strong>Aún no hay ventas</strong><span>'+(S.inv.length?'Registra la primera con «Nueva venta». El producto sale de tu inventario.':'Primero agrega tus productos en Inventario; después podrás venderlos aquí.')+'</span>'+(S.inv.length?'':'<button class="btn ghost" data-a="tab" data-v="inventario">Ir a Inventario</button>')+'</div>';
  }
  h+='<div class="tools"><input id="q" type="search" placeholder="Buscar cliente, guía, vendedor o producto" aria-label="Buscar ventas" value="'+esc(S.q)+'" autocomplete="off">'+
    '<div class="chips">'+[['all','Todas']].concat(HOLDERS.map(function(x){return [x,x]})).map(function(c){
      return '<button type="button" class="chip'+(S.hf===c[0]?' on':'')+'" data-a="hf" data-v="'+c[0]+'">'+c[1]+' <span class="num">'+money(totals[c[0]])+'</span></button>'}).join('')+'</div></div>';
  if(!list.length)return h+'<div class="empty"><strong>Sin resultados</strong><span>Ninguna venta coincide con la búsqueda o el filtro.</span></div>';
  var cur=null,buf=[];
  var flush=function(){
    if(cur===null)return;
    var t=0;buf.forEach(function(s){t+=net(s)});
    h+='<div class="month-head"><h3>'+mlabel(cur)+'</h3><span class="num">'+plural(buf.length,'venta','ventas')+' · '+money(t)+'</span></div><div class="group">'+buf.map(saleRow).join('')+'</div>';
  };
  list.forEach(function(s){var k=mkey(s.date);if(k!==cur){flush();cur=k;buf=[]}buf.push(s)});
  flush();
  return h;
}

/* ---------- inventario ---------- */
function viewInv(){
  var list=S.inv.slice().sort(function(a,b){return String(a.name).localeCompare(String(b.name),'es')});
  var units=0;list.forEach(function(p){units+=Math.max(0,avail(p))});
  var h='<div class="sec-head"><div><h2>Inventario</h2><p class="sub">'+plural(list.length,'producto','productos')+' · '+plural(units,'unidad disponible','unidades disponibles')+'</p></div><button class="btn" data-a="new-inv">+ Nuevo producto</button></div>';
  if(!list.length)return h+'<div class="empty"><strong>Tu inventario está vacío</strong><span>Agrega cada producto con su modelo, precio y cantidad. Las ventas descuentan de aquí.</span></div>';
  return h+'<div class="group">'+list.map(function(p){
    var a=avail(p),s=sold(p.id);
    return '<article class="row"><div class="r-main"><h3>'+esc(p.name)+(p.example?'<span class="tag">Ejemplo</span>':'')+'</h3><p>'+(p.model?'Modelo '+esc(p.model):'Sin modelo')+'</p></div>'+
      '<div class="r-amt num">'+money(cents(p.price))+'</div>'+
      '<p class="r-meta stat">Cantidad <b class="num">'+(parseInt(p.qty,10)||0)+'</b> · Vendidas <b class="num">'+s+'</b> · Disponibles <b class="num">'+a+'</b>'+(a===0?'<span class="pill-bad">Agotado</span>':a<0?'<span class="pill-bad">Revisar cantidad</span>':'')+'</p>'+
      '<div class="r-foot"><span></span>'+actsHTML('inv',p.id)+'</div></article>';
  }).join('')+'</div>';
}

/* ---------- gastos ---------- */
var IVA=0.13;
function taxByMonth(){
  var m={};
  S.sales.forEach(function(s){
    if(s.doc!=='CF'&&s.doc!=='CCF')return;
    var k=mkey(s.date);if(!k)return;
    var o=m[k]||(m[k]={cf:0,ccf:0,base:0});
    if(s.doc==='CF')o.cf++;else o.ccf++;
    o.base+=net(s);
  });
  return m;
}
function vatOf(base){return Math.round(base-base/(1+IVA))}
function prevKey(k){var p=k.split('-'),y=+p[0],m=+p[1]-1;if(m<1){m=12;y--}return y+'-'+pad(m)}
function taxExpenses(){
  var m=taxByMonth(),out=[];
  Object.keys(m).forEach(function(k){
    var o=m[k],vat=vatOf(o.base),cr=cents(S.credit[k]),pay=Math.max(0,vat-cr),left=Math.max(0,cr-vat);
    var p=k.split('-'),date=k+'-'+pad(new Date(+p[0],+p[1],0).getDate());
    var parts=[];if(o.cf)parts.push(plural(o.cf,'venta CF','ventas CF'));if(o.ccf)parts.push(plural(o.ccf,'venta CCF','ventas CCF'));
    var note=parts.join(' y ')+' por '+money(o.base)+' · IVA '+money(vat)+(cr?' − remanente '+money(cr):'')+(left?' · sobran '+money(left)+' para el mes siguiente':'');
    out.push({id:'auto-iva-'+k,auto:true,description:'IVA a pagar (13%) · '+mlabel(k),who:'Importoys',amount:pay/100,date:date,note:note});
  });
  return out;
}
function ivaSection(){
  var m=taxByMonth(),keys={};
  S.sales.forEach(function(s){if(s.date)keys[mkey(s.date)]=1});
  Object.keys(S.credit).forEach(function(k){keys[k]=1});
  keys[today().slice(0,7)]=1;
  var rows=Object.keys(keys).sort().reverse().map(function(k){
    var o=m[k],vat=o?vatOf(o.base):0,cr=cents(S.credit[k]),pay=Math.max(0,vat-cr),left=Math.max(0,cr-vat);
    var pk=prevKey(k),po=m[pk],pleft=Math.max(0,cents(S.credit[pk])-(po?vatOf(po.base):0));
    var hint=(pleft>0&&pleft!==cr)?'<p class="iva-hint">Del mes anterior sobraron '+money(pleft)+'. <button type="button" class="lk" data-a="use-credit" data-k="'+k+'" data-v="'+pleft+'">Usar este valor</button></p>':'';
    return '<div class="iva-row"><div class="iva-m"><h3>'+mlabel(k)+'</h3><span class="stat">IVA de ventas CF y CCF <b class="num">'+money(vat)+'</b></span></div>'+
      '<div class="fld"><label for="cr-'+k+'">Remanente del mes anterior ($)</label><input id="cr-'+k+'" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" data-a="credit" data-k="'+k+'" value="'+(cr?(cr/100).toFixed(2):'')+'"></div>'+
      '<div class="iva-pay"><span class="stat">IVA a pagar</span><b class="num">'+money(pay)+'</b>'+(left?'<small>Sobran '+money(left)+' para el mes siguiente</small>':'')+'</div>'+hint+'</div>';
  });
  return '<div class="sec-title">IVA por mes</div><div class="group">'+rows.join('')+'</div><p class="stat" style="margin:8px 2px 0">El IVA a pagar es el IVA de las ventas menos el remanente. Ese resultado pasa a los gastos de Importoys.</p>';
}
function allExp(){return S.exp.concat(taxExpenses())}
function viewExp(){
  var all=allExp();
  var list=all.slice().sort(function(a,b){return String(b.date).localeCompare(String(a.date))||(b.createdAt||0)-(a.createdAt||0)});
  var tot={Importoys:0,Importshop:0};all.forEach(function(e){tot[COMPANIES.indexOf(e.who)>=0?e.who:'Importoys']+=cents(e.amount)});
  var h='<div class="sec-head"><div><h2>Gastos</h2><p class="sub">'+plural(all.length,'gasto registrado','gastos registrados')+'</p></div><button class="btn" data-a="new-exp">+ Nuevo gasto</button></div>';
  h+='<div class="card" style="margin-bottom:6px"><div class="trio" style="grid-template-columns:repeat(3,minmax(0,1fr));border:0">'+
    COMPANIES.map(function(c){return '<div class="h-'+c+'"><div class="lab"><i class="dot"></i>'+c+'</div><div class="val num">'+money(tot[c])+'</div></div>'}).join('')+
    '<div><div class="lab" style="color:var(--ink)">Total</div><div class="val num">'+money(tot.Importoys+tot.Importshop)+'</div></div></div></div>';
  h+=ivaSection();
  if(!list.length)return h+'<div class="empty" style="margin-top:14px"><strong>Sin gastos todavía</strong><span>Registra cada gasto y quién lo pagó, Importoys o Importshop. Entran al cálculo de la liquidación.</span></div>';
  h+='<div class="sec-title">Gastos por mes</div>';
  var cur=null,buf=[];
  var flush=function(){
    if(cur===null)return;
    var t=0;buf.forEach(function(e){t+=cents(e.amount)});
    h+='<div class="month-head"><h3>'+mlabel(cur)+'</h3><span class="num">'+plural(buf.length,'gasto','gastos')+' · '+money(t)+'</span></div><div class="group">'+buf.map(function(e){
      var w=COMPANIES.indexOf(e.who)>=0?e.who:'Importoys';
      if(e.auto)return '<article class="row"><div class="r-main"><h3>'+esc(e.description)+'<span class="tag">Automático</span></h3><p><span class="who h-'+w+'"><i class="dot"></i>'+w+'</span> · '+esc(e.note)+'</p></div>'+
        '<div class="r-amt num">'+money(cents(e.amount))+'</div><p class="r-meta">El IVA se calcula solo con las ventas marcadas CF o CCF.</p></article>';
      return '<article class="row"><div class="r-main"><h3>'+esc(e.description)+(e.example?'<span class="tag">Ejemplo</span>':'')+'</h3><p><span class="who h-'+w+'"><i class="dot"></i>'+w+'</span> · '+fdate(e.date)+'</p></div>'+
        '<div class="r-amt num">'+money(cents(e.amount))+'</div><div class="r-foot"><span></span>'+actsHTML('exp',e.id)+'</div></article>';
    }).join('')+'</div>';
  };
  list.forEach(function(e){var k=mkey(e.date);if(k!==cur){flush();cur=k;buf=[]}buf.push(e)});
  flush();
  return h;
}

/* ---------- resumen mensual ---------- */
function holderCell(P,h){
  return '<div class="h-'+h+'"><div class="lab"><i class="dot"></i>'+h+'</div><div class="val num">'+money(P[h].inc)+'</div><div class="cnt">'+plural(P[h].n,'venta','ventas')+'</div></div>';
}
function monthCard(k){
  var r=calc(k),P=r.P;
  var h='<div class="month-head"><h3 style="font-size:20px">'+mlabel(k)+'</h3></div><section class="card">'+
    '<div class="mcard-head"><div><small style="text-align:left">Total de todas las ventas</small></div><div class="num">'+money(r.T.inc)+'</div></div>'+
    '<div class="trio">'+HOLDERS.map(function(x){return holderCell(P,x)}).join('')+'</div>'+
    '<dl class="kv">'+
      '<div><dt>Gastos de Importoys</dt><dd class="num">'+money(P.Importoys.exp)+'</dd></div>'+
      '<div><dt>Gastos de Importshop</dt><dd class="num">'+money(P.Importshop.exp)+'</dd></div>'+
      '<div><dt>Total de gastos</dt><dd class="num">'+money(r.T.exp)+'</dd></div>'+
      (r.tax?'<div><dt>Incluye IVA a pagar</dt><dd class="num">'+money(r.tax)+'</dd></div>':'')+

function liqKey(){var m=allMonths();return S.liq&&(S.liq==='all'||m.indexOf(S.liq)>=0)?S.liq:(m[0]||'all')}
function partyBlock(r,h){
  var p=r.P[h],isB=h==='Bodega';
  var res=p.diff>0?'<div class="res up">Tiene '+money(p.diff)+' de más: debe entregarlos</div>':p.diff<0?'<div class="res down">Le faltan '+money(-p.diff)+': debe recibirlos</div>':'<div class="res zero">Está al día</div>';

    (isB?'':'<div><dt>Gastos pagados</dt><dd class="num">−'+money(p.exp)+'</dd></div>')+
    '<div class="strong"><dt>Dinero que le queda</dt><dd class="num">'+money(p.bal)+'</dd></div>'+

function liqText(){
  var key=liqKey(),r=calc(key),P=r.P;
  var L=['Liquidación '+(key==='all'?'(todo el historial)':mlabel(key)),'',
    'Ventas netas: '+money(r.T.inc)];
  if(r.ded)L.push('Comisiones: −'+money(r.T.comm));
  L.push('Gastos: −'+money(r.T.exp),(r.profit<0?'Pérdida: ':'Ganancia: ')+money(r.profit),'Le corresponde a cada empresa: '+money(P.Importoys.target),'');
  HOLDERS.forEach(function(h){L.push(h+': le queda '+money(P[h].bal)+(h==='Bodega'?'':' (gastó '+money(P[h].exp)+')'))});
  L.push('');

  else L.push('Todo está al día, no hay pagos pendientes.');

}

function updateReadout(){
  var f=$('#f');if(!f||f.dataset.kind!=='sale')return;
  var sel=f.elements.product,o=sel.selectedOptions[0];

  var qty=Math.max(0,parseInt(f.elements.qty.value,10)||0),d=cents(f.elements.discount.value);
  $('#f-total').textContent=money(cents(unit)*qty-d);

async function saveSale(fd,sale){
  var customer=String(fd.get('customer')||'').trim(),date=fd.get('date'),pid=fd.get('product');
  var qty=parseInt(fd.get('qty'),10),disc=num(fd.get('discount')),comm=num(fd.get('commission'));
  if(!customer)return 'Escribe el nombre del cliente.';
  if(!date)return 'Elige la fecha de la venta.';
  if(!pid)return 'Elige el producto vendido.';
  if(!(qty>=1))return 'La cantidad debe ser 1 o más.';
  if(disc<0||comm<0)return 'El descuento y la comisión no pueden ser negativos.';
  var o=$('#f-product').selectedOptions[0];
  var unit=(sale&&pid===sale.productId)?Number(sale.unitPrice):Number(o.dataset.price);
  var prod=S.inv.filter(function(p){return p.id===pid})[0];
  if(prod){var a=avail(prod,sale&&sale.id);if(qty>a)return 'Solo hay '+a+' disponibles de este producto.'}
  if(cents(disc)>cents(unit)*qty)return 'El descuento no puede ser mayor al total.';
  var data={customer:customer,date:date,productId:pid,productName:o.dataset.name,productModel:o.dataset.model,unitPrice:unit,qty:qty,discount:disc,commission:comm,
    seller:String(fd.get('seller')||'').trim(),payment:String(fd.get('payment')||'').trim(),channel:fd.get('channel'),guide:String(fd.get('guide')||'').trim(),
    holder:fd.get('holder')||'Importoys',doc:fd.get('doc')||'Nada',createdAt:sale?(sale.createdAt||Date.now()):Date.now()};
  var ref=sale?S.db.doc('sales/'+sale.id):S.db.collection('sales').doc();
  try{await retry(function(){return ref.set(data)})}catch(e){return errMsg(e)}
  toast(sale?'Venta actualizada':'Venta guardada');return null;
}

/* ---------- eventos ---------- */
var COL={sale:'sales',inv:'inventory',exp:'expenses'};
document.addEventListener('click',async function(ev){
  var t=ev.target.closest('[data-a]');if(!t)return;
  var a=t.dataset.a,id=t.dataset.id;
  if(ev.target.tagName==='SELECT'||ev.target.tagName==='OPTION')return;
  switch(a){
    case 'tab':S.tab=t.dataset.v;S.del=null;render();break;
    case 'hf':S.hf=t.dataset.v;render();break;
    case 'new-sale':openSale();break;
    case 'edit-sale':openSale(id);break;
    case 'new-inv':openInv();break;
    case 'edit-inv':openInv(id);break;
    case 'new-exp':openExp();break;
    case 'edit-exp':openExp(id);break;
    case 'close-sheet':closeSheet();break;
    case 'ask-del':S.del=t.dataset.k+':'+id;render();break;
    case 'ask-clear-ex':S.del='ex';render();break;
    case 'del-no':S.del=null;render();break;
    case 'del-yes':
      if(needDb())break;
      S.del=null;
      await run(function(){return S.db.doc(COL[t.dataset.k]+'/'+id).delete()},'Eliminado');
      render();break;
    case 'clear-ex':{
      if(needDb())break;
      S.del=null;
      var jobs=[];
      S.inv.forEach(function(x){if(x.example)jobs.push('inventory/'+x.id)});
      S.sales.forEach(function(x){if(x.example)jobs.push('sales/'+x.id)});
      S.exp.forEach(function(x){if(x.example)jobs.push('expenses/'+x.id)});
      S.creditDocs.forEach(function(x){if(x.example)jobs.push('ivaCredit/'+x.id)});
      var ok=true;
      for(var i=0;i<jobs.length&&ok;i++){var path=jobs[i];ok=await run(function(){return S.db.doc(path).delete()})}
      toast(ok?'Ejemplos borrados':'No se pudieron borrar todos',!ok);
      render();break}
    case 'use-credit':
      if(needDb())break;
      await run(function(){return S.db.doc('ivaCredit/'+t.dataset.k).set({amount:Number(t.dataset.v)/100})},'Remanente guardado');
      break;
    case 'backup':{
      var s=S.db.exportAll(),b=new Blob([s],{type:'application/json'}),u=URL.createObjectURL(b),l=document.createElement('a');
      l.href=u;l.download='respaldo-ventas-'+today()+'.json';document.body.appendChild(l);l.click();l.remove();
      setTimeout(function(){URL.revokeObjectURL(u)},4000);toast('Copia descargada');break}
    case 'restore-pick':$('#restoreFile').click();break;
    case 'restore-no':S.restore=null;render();break;
    case 'restore-yes':{
      var d=S.restore;S.restore=null;
      await run(function(){return S.db.importAll(d)},'Copia restaurada');
      render();break}
    case 'copy':{
      var txt=liqText();
      try{await navigator.clipboard.writeText(txt);S.copy=null;toast('Resumen copiado');render()}
      catch(_){S.copy=txt;render();var ta=$('#copyta');if(ta){ta.focus();ta.select()}}
      break}
  }
});
document.addEventListener('change',function(ev){
  var t=ev.target,a=t.dataset&&t.dataset.a;
  if(t.id==='restoreFile'){
    var f=t.files&&t.files[0];t.value='';if(!f)return;
    var fr=new FileReader();
    fr.onload=function(){
      try{var o=JSON.parse(fr.result);if(!o||o.app!=='ventas-liquidacion'||typeof o.data!=='object')throw 0;S.restore=o.data;render()}
      catch(_){toast('Ese archivo no es una copia válida.',true)}
    };
    fr.readAsText(f);return;
  }
  if(a==='holder'){
    if(needDb()){render();return}
    var v=t.value,id=t.dataset.id;
    run(function(){return S.db.doc('sales/'+id).update({holder:v})},'Dinero pasado a '+v);
  }else if(t.id==='liqm'){S.liq=t.value;S.copy=null;render()}
  else if(a==='credit'){
    if(needDb()){render();return}
    var k=t.dataset.k,v=num(t.value);
    if(v<0){toast('El remanente no puede ser negativo.',true);render();return}
    run(function(){var r=S.db.doc('ivaCredit/'+k);return v>0?r.set({amount:v}):r.delete()},v>0?'Remanente guardado':'Remanente quitado');
  }
  else if(a==='ded'){
    if(needDb()){render();return}
    var on=t.checked;
    run(function(){return S.db.doc('config/main').set({deduct:on})},on?'Se descuentan las comisiones':'No se descuentan las comisiones');
  }
});
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.id==='q'){S.q=t.value;sched()}
  else if(t.closest&&t.closest('#f'))updateReadout();
});
document.addEventListener('submit',async function(ev){
  if(ev.target.id!=='f')return;
  ev.preventDefault();
  if(!sheetSubmit)return;
  var f=ev.target,btn=f.querySelector('button[type=submit]');
  if(btn)btn.disabled=true;
  var err=await sheetSubmit(new FormData(f));
  if(btn)btn.disabled=false;
  if(err){var e=$('#ferr');if(e)e.textContent=err}else closeSheet();
});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
$('#sheet').addEventListener('click',function(ev){if(ev.target===ev.currentTarget)closeSheet()});
$('#view').addEventListener('toggle',function(ev){
  var d=ev.target;if(d.tagName==='DETAILS'&&d.dataset.k){if(d.open)S.open.add(d.dataset.k);else S.open.delete(d.dataset.k)}
},true);

/* ---------- almacenamiento local (sin servidor) ---------- */
function makeLocalDb(){
  var KEY='importoys-ventas-v1',COLS=['inventory','sales','expenses','ivaCredit','config'],data={},subs=[];
  function load(){try{var o=JSON.parse(localStorage.getItem(KEY)||'{}');data=o&&typeof o==='object'?o:{}}catch(e){data={}}}
  function save(){localStorage.setItem(KEY,JSON.stringify(data))}
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
  function colSnap(col){var c=data[col]||{};var docs=Object.keys(c).sort().map(function(id){var v=c[id];return {id:id,exists:true,data:function(){return v}}});return {docs:docs,size:docs.length,empty:!docs.length}}
  function docSnap(col,id){var v=(data[col]||{})[id];return {id:id,exists:v!==undefined,data:function(){return v}}}
  function notify(){subs.slice().forEach(function(s){s()})}
  function sub(fire){subs.push(fire);setTimeout(fire,0);return function(){subs=subs.filter(function(x){return x!==fire})}}
  function write(fn){
    return new Promise(function(res,rej){
      var backup=JSON.stringify(data);
      try{fn();save();notify();res()}
      catch(e){try{data=JSON.parse(backup)}catch(_){}
        var q=e&&(e.name==='QuotaExceededError'||e.code===22);
        rej(e&&e.code&&typeof e.code==='string'?e:{code:q?'quota_exceeded':'unavailable'})}
    });
  }
  function clone(v){return JSON.parse(JSON.stringify(v))}
  function docRef(col,id){
    return {id:id,path:col+'/'+id,
      set:function(v){return write(function(){(data[col]||(data[col]={}))[id]=clone(v)})},
      update:function(v){return write(function(){var c=data[col]||{};if(c[id]===undefined)throw {code:'invalid_argument'};Object.assign(c[id],clone(v))})},
      delete:function(){return write(function(){if(data[col])delete data[col][id]})},
      onSnapshot:function(next){return sub(function(){next(docSnap(col,id))})}};
  }
  load();
  window.addEventListener('storage',function(e){if(e.key===KEY){load();notify()}});
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(_){}
  return {
    collection:function(col){return {onSnapshot:function(next){return sub(function(){next(colSnap(col))})},doc:function(id){return docRef(col,id||uid())}}},
    doc:function(path){var p=path.split('/');return docRef(p[0],p[1])},
    exportAll:function(){return JSON.stringify({app:'ventas-liquidacion',version:1,exportedAt:new Date().toISOString(),data:data},null,1)},
    importAll:function(d){return write(function(){var n={};COLS.forEach(function(c){n[c]=(d&&typeof d[c]==='object'&&d[c])?clone(d[c]):{}});data=n})}
  };
}

});

})();

init();
